<?xml version="1.0" encoding="UTF-8"?>
<!-- Simplified static SVG fallback for architecture diagram -->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <style>
    .box { fill:#f3f4f6; stroke:#111827; stroke-width:1; rx:6; }
    .title { font: bold 14px sans-serif; fill:#111827 }
    .small { font: 12px sans-serif; fill:#111827 }
  </style>
  <rect x="300" y="10" width="200" height="36" class="box" />
  <text x="310" y="33" class="title">Orchestrator / Frontend</text>

  <rect x="300" y="60" width="200" height="30" class="box" />
  <text x="310" y="80" class="small">Agent Manager / Scheduler</text>

  <rect x="300" y="110" width="200" height="30" class="box" />
  <text x="310" y="130" class="small">Agents</text>

  <rect x="80" y="110" width="180" height="30" class="box" />
  <text x="90" y="130" class="small">Memory / Vector Store</text>

  <rect x="520" y="110" width="180" height="60" class="box" />
  <text x="530" y="135" class="small">Model Layer</text>
  <text x="530" y="150" class="small">Embeddings • LLMs</text>

  <rect x="300" y="180" width="200" height="30" class="box" />
  <text x="310" y="200" class="small">Perception (Vision/ASR/TTS)</text>

  <rect x="300" y="230" width="200" height="30" class="box" />
  <text x="310" y="250" class="small">Planner → Executor</text>

  <!-- connectors -->
  <line x1="400" y1="46" x2="400" y2="60" stroke="#111827" />
  <line x1="400" y1="90" x2="265" y2="120" stroke="#111827" />
  <line x1="500" y1="140" x2="520" y2="140" stroke="#111827" />
  <line x1="400" y1="170" x2="400" y2="180" stroke="#111827" />

  <text x="20" y="30" class="title">HERCULE Architecture</text>
</svg>
